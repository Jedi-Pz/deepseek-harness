# dsh-mouding bundle patch: 谋鼎智能体（藏宝智道 V11）的 DSH profile 层。
#
# 插入一行 MCP 占位连接（未设置 MCP_URL 时保持禁用）、九个专业角色 preset，
# 以及主 Agent preset。安装后，新会话选择器中出现「谋鼎」自定义 preset；
# 主 Agent 通过 subagent 工具的 agent_preset 参数调度九个角色。
#
# 角色 preset 的 persona 从本包 prompts/ 读取；路径经由 profile 的 node_modules
# 解析（baseUrl 由 Loader 提供），因此包必须通过 plugin_manager install_bundle 安装。

- insert:
    # ── 外部金融数据（MCP 占位）──────────────────────────────────────────────
    # 设置环境变量 MCP_URL 后自动启用；未设置时整行禁用，谋鼎仍可运行但会把
    # 外部数据能力标注为不可达。
    - id: mcp-mouding
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!process.env.MCP_URL"
      config:
        serverName: mouding
        transport: streamable-http
        url: !!js process.env.MCP_URL
        toolCallTimeoutMs: 60000
        failOnStartupError: false

    # ── 九个专业角色（被主 Agent 以 agent_preset 调度）──────────────────────
    - id: preset-mouding-delta-insight
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mouding-delta-insight
        name: Δ 洞察体
        description: 采集并整理证券价格、财务、资金、估值与事件事实，识别趋势结构和客观异常，供后续角色核验。
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-mouding/prompts/agents/delta-insight.md'), 'utf8')
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

    - id: preset-mouding-macro-worldview
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mouding-macro-worldview
        name: 宏观世界观
        description: 判断宏观时代结构、主导矛盾、政策方向、风险溢价和产业映射，为证券研究提供上位约束。
        order: 22
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-mouding/prompts/agents/macro-worldview.md'), 'utf8')
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

    - id: preset-mouding-omega-awareness
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mouding-omega-awareness
        name: Ω 圆觉体
        description: 核验前序事实与逻辑，执行双核交叉否决、偏误扫描、边界检查和风险前置评估。
        order: 23
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-mouding/prompts/agents/omega-awareness.md'), 'utf8')
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

    - id: preset-mouding-treasure-map
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mouding-treasure-map
        name: 藏宝图（左核）
        description: 计算时间周期共振，识别结构临界点、潜在变盘区和窗口级别，为右核确认提供左核预警。
        order: 24
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-mouding/prompts/agents/treasure-map.md'), 'utf8')
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

    - id: preset-mouding-chain-balance
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mouding-chain-balance
        name: 链式制衡
        description: 穿透产业链供需、技术依存、替代路径和冲击传导，评估真实制衡力与断供反噬。
        order: 25
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-mouding/prompts/agents/chain-balance.md'), 'utf8')
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

    - id: preset-mouding-venus-system
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mouding-venus-system
        name: 金星七维（右核）
        description: 以 2 日与 21 日均线为基础执行金星七维确认，判断趋势是否成立、失效及是否具备行动许可。
        order: 26
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-mouding/prompts/agents/venus-system.md'), 'utf8')
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

    - id: preset-mouding-risk-radar
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mouding-risk-radar
        name: 风险雷达
        description: 量化周期、估值、资金与趋势风险，估计回撤概率，检查 S1-S7 熔断并给出防御边界。
        order: 27
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-mouding/prompts/agents/risk-radar.md'), 'utf8')
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

    - id: preset-mouding-phi-prediction
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mouding-phi-prediction
        name: Φ 预言体
        description: 基于已校验事实、窗口、趋势与风险构建基准/乐观/谨慎情景，给出概率树、验证节点和策略映射。
        order: 28
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-mouding/prompts/agents/phi-prediction.md'), 'utf8')
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

    - id: preset-mouding-research-report
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mouding-research-report
        name: 研报升维 3.0
        description: 用道法术器与九段式框架整合宏观、产业、财务、估值、双核和风险结果，形成结构化深度研报。
        order: 29
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-mouding/prompts/agents/research-report.md'), 'utf8')
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

    # ── 主 Agent preset ──────────────────────────────────────────────────────
    - id: preset-mouding
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mouding
        name: 谋鼎
        description: 谋鼎智能体 · 藏宝智道 V11 五阶段投研
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-mouding/prompts/main.md'), 'utf8')
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # 子智能体调度：spawn 后端 + 九个角色 preset 的 allowlist。
          # 模型通过 subagent 的 agent_preset 参数选择角色。
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              allowedAgentPresets:
                - mouding-delta-insight
                - mouding-macro-worldview
                - mouding-omega-awareness
                - mouding-treasure-map
                - mouding-chain-balance
                - mouding-venus-system
                - mouding-risk-radar
                - mouding-phi-prediction
                - mouding-research-report
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'

          # 长研究会话的上下文压缩（内部机制，不增加工具）。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
